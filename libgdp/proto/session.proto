// Session phase control and input streams (spectre <-> wraith), both ends
// via libgdp. Video/audio are raw datagrams, not protobuf — see
// gdp-spec.md §9/§10.
syntax = "proto3";
package gdp.session;

// --- Control stream (gdp-spec.md §6, §7) ---

// Grouped by purpose; 1-15 are the one-byte tags, kept for what is sent
// often or matters most, with the rarest message (a logout, once) at 16.
message ControlEnvelope {
  oneof msg {
    // Opening the session.
    SessionHello hello = 1;
    SessionAccept accept = 2;
    SessionReject reject = 3;
    // Liveness and measurement.
    StatsReport stats = 4;
    Ping ping = 5;
    Pong pong = 6;
    GatewayPath gateway_path = 7;
    // The picture: outputs and the pointer.
    DisplaysChanged displays_changed = 8;
    ResolutionChange resolution_change = 9;
    CursorShape cursor_shape = 10;
    CursorPosition cursor_position = 11;
    // Steering the stream.
    KeyframeRequest keyframe_request = 12;
    NetworkProfileChanged network_profile_changed = 13;
    RefinePause refine_pause = 14;
    // Data and ending.
    ClipboardData clipboard = 15;
    LogoutRequest logout_request = 16;
    // Support: the host asks the client what it knows (wraith --report).
    DiagnosticsRequest diagnostics_request = 17;
    DiagnosticsReport diagnostics_report = 18;
    // Files a user copied, for the other end to fetch (§7.12): the host's,
    // and with file-clipboard the client's too.
    FileList file_list = 19;
    // file-clipboard, file-share: the host asks the client for one of its
    // files, or a folder's contents; the client answers on a file stream.
    FileFetch file_fetch = 20;
    // file-share: a folder the client shares with the host, or stops sharing.
    FileShare file_share = 21;
    // What the desktop is doing that the client may act on (§7.13).
    DesktopState desktop_state = 22;
  }
}

message DisplayDescriptor {
  uint32 width = 1;
  uint32 height = 2;
  uint32 refresh_mhz = 3;  // refresh rate * 1000, matches Wayland's mode reporting
  double scale = 4;
}

// Grouped by purpose (gdp-spec.md §6.2): who is connecting and how, then
// the picture, then extensions, then what is only informational.
message SessionHello {
  // Who and how.
  string token = 1;                    // from lobby Redirect.token
  // The user's session is already open on another client: ask the host to
  // disconnect that viewer (it gets TAKEN_OVER) and attach this one, instead
  // of refusing with ALREADY_CONNECTED. Only ever honoured for a connection
  // whose token checked out, which is the same user (gdp-spec.md §6.4
  // "Taking a session over").
  bool take_over = 2;
  // Set by a gateway (Veil) as it relays the session, overwriting what the
  // client sent; a client always leaves it false. How wraith knows the
  // session is relayed (gdp-spec.md §6.10).
  bool via_gateway = 3;
  // What kind of link this is, for wraith's rate controller (gdp-spec.md
  // §6.9). AUTO -- also what a spectre that leaves it
  // out sends -- lets wraith pick from what it measures.
  NetworkProfile network_profile = 4;

  // The picture.
  repeated DisplayDescriptor displays = 5;
  // Video codecs spectre can decode, in preference order (gdp-spec.md §6.6
  // "Codec negotiation"): wraith picks the first it can encode and echoes
  // it in SessionAccept.codec, or closes with NO_COMMON_CODEC (§12).
  repeated string codecs = 6;          // e.g. "h264"
  // What the client can decode and show beyond the baseline every client
  // takes: 8-bit 4:2:0 in every codec it offers, BT.709 primaries, sRGB
  // transfer (gdp-spec.md §7.3 "Colour negotiation"). The host picks its
  // OutputDescriptor.color from the baseline plus these. Empty: baseline
  // only.
  repeated CodecFormat codec_formats = 7;
  repeated ColorPrimaries primaries = 8;
  repeated ColorTransfer transfers = 9;

  // Extensions.
  // Optional protocol extensions spectre understands (gdp-spec.md §6.7
  // "Capabilities"). wraith replies with the subset it also supports;
  // only those are in effect for the session. Unknown names are ignored.
  repeated string capabilities = 10;
  // Refinement tile formats the client accepts (gdp-spec.md §9.5), beyond
  // REFINE_FORMAT_BGR8, which every client that offers "refine" accepts.
  repeated RefineFormat refine_formats = 11;

  // Informational.
  repeated string decoders = 12;       // e.g. "vulkan", "vaapi", "software", "d3d11va"
  string client_name = 13;             // the client machine's name, e.g. "office-pc"
}

// More a client can decode in one of its `codecs` (gdp-spec.md §7.3).
message CodecFormat {
  string codec = 1;                // a token from SessionHello.codecs
  repeated uint32 bit_depths = 2;  // per component, beyond 8; e.g. 10
  repeated Chroma chroma = 3;      // subsamplings beyond 4:2:0
}

enum Chroma {
  CHROMA_UNSPECIFIED = 0;
  CHROMA_420 = 1;
  CHROMA_422 = 2;
  CHROMA_444 = 3;
}

// The pixel format of refinement tiles (gdp-spec.md §9.5).
enum RefineFormat {
  REFINE_FORMAT_BGR8 = 0;  // 3 bytes: B, G, R, 8 bits each
}

enum NetworkProfile {
  NETWORK_PROFILE_AUTO = 0;
  NETWORK_PROFILE_LAN = 1;
  NETWORK_PROFILE_INTERNET = 2;
  NETWORK_PROFILE_MOBILE = 3;
}

message OutputDescriptor {
  uint32 stream_id = 1;                // matches video datagram stream_id, §9
  DisplayDescriptor display = 2;
  // How to read the decoded pictures. Unset, or any field UNSPECIFIED,
  // means the codec's conventional defaults (gdp-spec.md §7.3).
  ColorDescription color = 3;
}

// What the pixels of a stream mean, so a client doesn't have to guess how
// the host converted them. wraith fills every field of what it really does.
// Depth, chroma, primaries and transfer stay within what SessionHello
// declared (gdp-spec.md §7.3).
message ColorDescription {
  ColorMatrix matrix = 1;      // RGB <-> YCbCr coefficients
  ColorRange range = 2;
  ColorPrimaries primaries = 3;
  ColorTransfer transfer = 4;
  uint32 bit_depth = 5;        // per component; 0 = 8
  Chroma chroma = 6;           // UNSPECIFIED = 4:2:0
}

enum ColorMatrix {
  COLOR_MATRIX_UNSPECIFIED = 0;
  COLOR_MATRIX_BT601 = 1;
  COLOR_MATRIX_BT709 = 2;
  COLOR_MATRIX_BT2020_NCL = 3;
}

enum ColorRange {
  COLOR_RANGE_UNSPECIFIED = 0;
  COLOR_RANGE_LIMITED = 1;     // 16-235 luma, 16-240 chroma at 8 bits
  COLOR_RANGE_FULL = 2;
}

enum ColorPrimaries {
  COLOR_PRIMARIES_UNSPECIFIED = 0;
  COLOR_PRIMARIES_BT709 = 1;   // also sRGB's
  COLOR_PRIMARIES_BT2020 = 2;
}

enum ColorTransfer {
  COLOR_TRANSFER_UNSPECIFIED = 0;
  COLOR_TRANSFER_SRGB = 1;
  COLOR_TRANSFER_PQ = 2;       // SMPTE ST 2084
  COLOR_TRANSFER_HLG = 3;
}

// The first frame (§3.1 framing) on every reliable stream other than
// control (0) and input (4), opened by either peer. It names what the
// stream carries, so a peer that doesn't know the kind can refuse it
// (reset with UNSUPPORTED) instead of misreading it. A kind is only used on
// a session that negotiated the capability of the same name. Everything
// after this frame is that kind's own protocol. Kinds: "file" (§7.12).
message StreamOpen {
  string kind = 1;     // lowercase token, like capabilities: e.g. "file"
  bytes params = 2;    // the kind's own opening parameters, if any
}

// --- File transfer (gdp-spec.md §7.12): the "file" capability and stream kind ---

// StreamOpen.params of a "file" stream. Always opened by the client. A
// host that gets a case it doesn't know replies
// FileReply{refused{FILE_ERROR_UNSUPPORTED}}.
message FileOpen {
  oneof open {
    FileOffer offer = 1;            // client -> host: here is a file
    FileRequest request = 2;        // host -> client: send me this one of the FileList
    FileListingRequest listing = 3; // file-clipboard: what is in this folder of the host's FileList
    FileAnswer answer = 4;          // file-clipboard, file-share: the answer to a FileFetch follows
  }
}

// On the control stream: the files a user copied. host -> client always;
// client -> host with file-clipboard. Sent when the clipboard comes to hold
// copied files, with no files when it no longer does, and once right after
// SessionAccept if it does.
message FileList {
  uint64 list_id = 1;               // new with every list from that end; never 0
  repeated FileListEntry files = 2; // what was copied, in order; with file-clipboard, then what is in its folders
}

message FileListEntry {
  string name = 1;              // the file's own name, §7.12's rules
  uint64 size = 2;              // when the list was made; FileSending says what is sent
  int64 modified_unix_ms = 3;   // 0 = unknown
  bool directory = 4;           // a folder
  // file-clipboard:
  uint32 parent = 5;            // 0: one of the things copied; else 1 + the index of the folder it is in
  bool unlisted = 6;            // a folder whose contents aren't in the list: ask for them (FileListingRequest)
}

// file-clipboard: the contents of folder `index` of list `list_id`.
message FileListingRequest {
  uint64 list_id = 1;
  uint32 index = 2;
}

// A folder's contents (FileReply.listing): its entries, which take the
// indices from `first_index` on in their list (a shared folder's have none).
// One or more of these, then FIN.
message FileListing {
  uint32 first_index = 1;
  repeated FileListEntry files = 2;
}

// host -> client, on the control stream (file-clipboard, file-share): send
// one of your files, or a folder's contents. The client opens a "file"
// stream whose FileOpen is FileAnswer{fetch_id} and writes, after it, one
// FileReply (sending and the bytes, listing, or refused), then FIN.
message FileFetch {
  uint64 fetch_id = 1;   // new with every fetch; names the answering stream
  uint64 list_id = 2;    // one of the client's FileLists ...
  uint32 index = 3;      // ... and an entry in it
  uint64 offset = 4;     // as FileRequest
  uint64 length = 5;     // as FileRequest
  bool listing = 6;      // a folder's contents (FileListing), not bytes
  // file-share: instead of list_id and index, a path in a shared folder.
  uint64 share_id = 7;
  string path = 8;       // '/'-separated parts, each a valid name; "" the shared folder itself
}

message FileAnswer {
  uint64 fetch_id = 1;
}

// client -> host, on the control stream (file-share): a folder the client's
// user shares, read-only, for the life of the session; `removed` takes it back.
message FileShare {
  uint64 share_id = 1;   // new with every share; never 0
  string name = 2;       // what the host shows it as; §7.12's name rules
  bool removed = 3;
}

message FileRequest {
  uint64 list_id = 1;   // the FileList it comes from
  uint32 index = 2;     // into its files
  uint64 offset = 3;    // the first byte wanted; past the end: none
  uint64 length = 4;    // how many from there; 0 = to the end of the file
}

message FileOffer {
  string name = 1;              // the file's own name, no path; UTF-8, NFC (§7.12 for the rules)
  uint64 size = 2;              // exactly this many raw bytes follow FileReply.accepted
  int64 modified_unix_ms = 3;   // 0 = unknown; the receiver may give the file this mtime
}

// Every frame the receiver sends on a "file" stream, in its own direction.
message FileReply {
  oneof reply {
    FileAccepted accepted = 1;  // send the bytes
    FileError refused = 2;      // the offer is refused; FIN follows
    FileSaved saved = 3;        // every byte written and the file in place; FIN follows
    FileError failed = 4;       // accepted, then failed; FIN follows
    FileSending sending = 5;    // to a FileRequest: the file's raw bytes follow, then FIN
    FileListing listing = 6;    // to a listing: a folder's contents, possibly in several frames, then FIN
  }
}

message FileSending {
  string name = 1;
  uint64 size = 2;              // exactly this many raw bytes follow
  int64 modified_unix_ms = 3;
  uint64 offset = 4;            // where in the file they start (0 from a host that ignores ranges)
  uint64 file_size = 5;         // the whole file's length when the host opened it
}

message FileAccepted {}

message FileSaved {
  string name = 1;              // the name it was saved under: "name (1).ext" when the offered one was taken
  string directory = 2;         // the folder it was saved in, an absolute path on the host; "" if not said
}

message FileError {
  FileErrorCode code = 1;
}

enum FileErrorCode {
  FILE_ERROR_UNSPECIFIED = 0;
  FILE_ERROR_UNSUPPORTED = 1;   // a FileOpen case the receiver doesn't know
  FILE_ERROR_BAD_NAME = 2;      // the name breaks §7.12's rules
  FILE_ERROR_NO_SPACE = 3;      // not enough free space, checked on accept or met while writing
  FILE_ERROR_REFUSED = 4;       // the receiver's policy or its user said no
  FILE_ERROR_WRITE_FAILED = 5;  // any other I/O error
  FILE_ERROR_SIZE_MISMATCH = 6; // FIN before size bytes, or more than size
  FILE_ERROR_GONE = 7;          // a request for a list or file that is no longer there
  FILE_ERROR_READ_FAILED = 8;   // the host couldn't read the file
}

message AudioConfig {
  uint32 sample_rate_hz = 1;  // 48000 today
  uint32 channels = 2;        // 2 today
  uint32 frame_ms = 3;        // 10 today -- fixes payload size at sample_rate_hz/1000*frame_ms*channels samples
  string codec = 4;           // "opus" today -- what §10's datagram payloads are (gdp-spec.md §10)
}

// Grouped like SessionHello (gdp-spec.md §6.5).
message SessionAccept {
  // The picture.
  repeated OutputDescriptor outputs = 1;
  string codec = 2;                    // one of SessionHello.codecs
  uint32 bitrate_ceiling_bps = 3;

  // Sound.
  AudioConfig audio = 4;
  // The format of the client -> host microphone channel (gdp-spec.md
  // §10.1). Present exactly when "microphone" is in capabilities.
  AudioConfig microphone = 5;

  // Extensions.
  repeated string capabilities = 6;    // subset of SessionHello.capabilities now in effect

  // The link.
  // The profile wraith's rate control is running with (gdp-spec.md §6.9
  // "Network profile"): the one SessionHello asked for, or -- for AUTO --
  // the one wraith classified the link as. Informational. AUTO (0) here
  // means a wraith that doesn't report it.
  NetworkProfile network_profile = 7;
  // SessionHello.via_gateway echoed: whether a gateway relays this
  // session, so every client knows from the first reply.
  bool via_gateway = 8;

  // Informational, for the client's own UI (gdp-spec.md §6.5):
  // which encoder backend is producing the stream ("vaapi" or "software";
  // empty from a wraith that doesn't report it), and whose session this
  // is on which host, e.g. "alice" @ "alice-pc".
  string encoder = 9;
  string host_user = 10;
  string host_name = 11;
}

message SessionReject {
  string reason = 1;
}

message DisplaysChanged {
  repeated OutputDescriptor outputs = 1;  // full replacement, not a delta
}

message ResolutionChange {
  uint32 stream_id = 1;
  DisplayDescriptor display = 2;
}

message KeyframeRequest {
  uint32 stream_id = 1;
}

// Either direction, only when the session negotiated the "clipboard"
// capability (gdp-spec.md §7.9); a peer drops one it never
// negotiated. v1 is text only: mime_type is literally "text/plain" and
// data is UTF-8, capped at 4 MiB (libgdp's clipboard.hpp). Any other
// mime_type is dropped rather than forwarded, which leaves room for
// images and other formats later with no wire change. Empty data is
// never sent -- there is no "clear the clipboard" operation.
message ClipboardData {
  string mime_type = 1;
  bytes data = 2;
}

message CursorShape {
  uint32 width = 1;
  uint32 height = 2;
  uint32 hotspot_x = 3;
  uint32 hotspot_y = 4;
  bytes argb8888 = 5;  // width * height * 4 bytes, premultiplied
}

// wraith -> spectre: where the server-side pointer is, 0..1 normalized over
// the output like PointerMotion.absolute. Sent while spectre drives the
// pointer with relative motion, where only wraith knows where it ended up
// (edge clamping, confine regions, locks, cursor-hint warps).
message CursorPosition {
  double x = 1;
  double y = 2;
}

// spectre -> wraith, only after SessionAccept (gdp-spec.md §7.10): end the desktop session -- not
// just this connection -- the way the desktop's own logout would. Unconditional and unacknowledged:
// the CONNECTION_CLOSE that follows (SESSION_ENDED, gdp-spec.md §12) is the completion signal.
message LogoutRequest {}

// wraith -> spectre, after SessionAccept: an AUTO session's rate control
// reclassified the link (gdp-spec.md §6.9).
// Informational, like SessionAccept.network_profile, which it supersedes.
message NetworkProfileChanged {
  NetworkProfile profile = 1;
}

// spectre -> wraith, after SessionAccept, only on a session that
// negotiated "refine" (gdp-spec.md §7.8): stop or resume building the
// lossless tile layer -- the client's Lossless switch. The
// capability stays in effect either way; a paused host sends a reset
// layer and then empty ones. Every connection starts unpaused.
message RefinePause {
  bool paused = 1;
}

// wraith -> spectre (gdp-spec.md §7.13): the desktop's state, every field
// each time -- once after SessionAccept, then on each change. Hints, all
// false by default, so a field a host doesn't know arrives as "not so".
// Needs no capability: a client that doesn't know it changes nothing.
message DesktopState {
  // An application in the desktop is holding it awake (a video playing, a
  // game): the client keeps its own display awake meanwhile.
  bool idle_inhibited = 1;
}

// wraith -> spectre: send a DiagnosticsReport (gdp-spec.md §7.11). Sent
// only when the session's user ran `wraith --report` in the desktop.
message DiagnosticsRequest {}

// spectre -> wraith, once per DiagnosticsRequest: what the client would
// say if asked why something isn't working, as plain text -- its log,
// the decoder and GPU it ended up with, what it offered. wraith puts it
// in the user's report as it is.
message DiagnosticsReport {
  bytes text = 1;  // at most 512 KiB; not necessarily valid UTF-8
}

message StreamStats {
  uint32 stream_id = 1;
  uint32 highest_frame_id_acked = 2;
  uint64 loss_bitmap = 3;       // bit i set = frame_id (highest - i) was lost, i in [0,64)
  uint32 decode_us = 4;
  uint32 present_us = 5;
  // Receive-side measurements over this report's window (gdp-spec.md §7.5).
  // All zero from a spectre that can't measure them;
  // interval_us == 0 is how wraith tells.
  uint32 interval_us = 6;       // how long the window was
  uint64 bytes_received = 7;    // video datagram bytes received in it, headers included
  // One-way delay of each frame's first slice: arrival on spectre's session
  // clock minus the frame's pts. The two clocks are zeroed at different
  // moments (§11), so the value carries an unknown constant offset and can be
  // negative; only its movement is meaningful. Both are 0 (and
  // delay_samples is 0) when no first slice arrived in the window.
  sint32 delay_min_us = 8;
  sint32 delay_avg_us = 9;
  uint32 delay_samples = 10;
  // How the larger frames completed in this window arrived (gdp-spec.md
  // §7.5): their datagrams leave the host back to back, so the
  // spread the path puts between them measures its slowest hop. Absent
  // from a spectre that doesn't measure it.
  repeated FrameTrain trains = 11;
  // Forward error correction (gdp-spec.md §7.5, §9.7): the data slices of
  // the frames finished in this window (delivered or given up on), how
  // many of them never arrived -- before any recovery, so the host can size
  // its parity -- and how many frames parity rebuilt. Frames none of whose
  // datagrams arrived aren't counted. All 0 from a spectre that doesn't
  // measure them.
  uint64 slices_expected = 12;
  uint64 slices_lost = 13;
  uint32 fec_recovered_frames = 14;
}

message FrameTrain {
  uint32 frame_id = 1;
  uint32 datagrams = 2;  // all of the frame's datagrams, every one arrived
  uint32 bytes = 3;      // datagram bytes after the first to arrive, headers included
  uint32 span_us = 4;    // first arrival to last, as the transport's network thread read them
}

message StatsReport {
  uint32 rtt_us = 1;
  repeated StreamStats streams = 2;
}

// Sent only by a gateway (Veil), toward the client, about once a second:
// the round trip of the leg beyond it, so the client can show and report
// the whole path's RTT (its own connection ends at the gateway).
message GatewayPath {
  uint32 upstream_rtt_us = 1;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

// --- Input stream (gdp-spec.md §8) ---

message InputEnvelope {
  uint64 client_time_us = 1;
  oneof event {
    KeyEvent key = 2;
    PointerMotion pointer_motion = 3;
    PointerButton pointer_button = 4;
    PointerAxis pointer_axis = 5;
    TouchEvent touch = 6;
    GamepadConnect gamepad_connect = 7;
    GamepadState gamepad = 8;
    GamepadDisconnect gamepad_disconnect = 9;
    HidConnect hid_connect = 10;
    HidInput hid_input = 11;
    HidGetReportReply hid_get_report_reply = 12;
    HidSetReportReply hid_set_report_reply = 13;
    SecurityKeyConnect security_key_connect = 14;
    SecurityKeyDisconnect security_key_disconnect = 15;
    SecurityKeyInput security_key_input = 16;
    SmartcardReaderAdded smartcard_reader_added = 17;
    SmartcardReaderRemoved smartcard_reader_removed = 18;
    SmartcardCardInserted smartcard_card_inserted = 19;
    SmartcardCardRemoved smartcard_card_removed = 20;
    SmartcardPowered smartcard_powered = 21;
    SmartcardResponse smartcard_response = 22;
  }
}

// wraith -> spectre on the input stream, only under the "hid",
// "security-key" and "smartcard" capabilities (gdp-spec.md §8.4, §8.6,
// §8.7, §8.8). Nothing else is sent toward the client there.
message HostInputEnvelope {
  oneof event {
    HidRejected hid_rejected = 1;
    HidOutput hid_output = 2;
    HidGetReport hid_get_report = 3;
    HidSetReport hid_set_report = 4;
    SecurityKeyRejected security_key_rejected = 5;
    SecurityKeyOutput security_key_output = 6;
    SmartcardRejected smartcard_rejected = 7;
    SmartcardPower smartcard_power = 8;
    SmartcardTransmit smartcard_transmit = 9;
  }
}

enum KeyState {
  KEY_STATE_UNSPECIFIED = 0;
  KEY_STATE_PRESSED = 1;
  KEY_STATE_RELEASED = 2;
}

message KeyEvent {
  uint32 hid_usage = 1;  // USB HID usage ID, not evdev/scancode -- see gdp-spec.md §8
  KeyState state = 2;
}

message PointerMotion {
  double dx = 1;
  double dy = 2;
  bool absolute = 3;   // if true, dx/dy are 0..1 normalized, not a delta
}

message PointerButton {
  uint32 button = 1;   // Linux input-event-codes.h BTN_* value
  KeyState state = 2;  // PRESSED/RELEASED reused; there's no third pointer state
}

message PointerAxis {
  double horizontal = 1;
  double vertical = 2;
}

// Gamepads (gdp-spec.md §8.5), only on a session that
// negotiated the "gamepad" capability -- a peer drops all three otherwise.
// pad_index is a client-chosen slot in [0, gdp::kMaxGamepads); the host
// keeps one virtual device per slot for as long as it is connected.

// spectre -> wraith: a controller appeared in `pad_index`. `name` is for
// logs only, never trusted for anything. A connect for a slot that is
// already connected replaces it.
message GamepadConnect {
  uint32 pad_index = 1;
  string name = 2;
}

// spectre -> wraith: the controller in `pad_index` went away. A
// disconnect for a slot that isn't connected is ignored.
message GamepadDisconnect {
  uint32 pad_index = 1;
}

// spectre -> wraith: the full current state of the controller in
// `pad_index` -- every axis and every button, in SDL3's gamepad order as
// pinned in libgdp's gdp/gamepad.hpp (the wire does not depend on the SDL
// version either end links). Axes are -1..1 for sticks, 0..1 for
// triggers. A snapshot rather than per-control events so a lost or
// reordered frame can never leave a button stuck: the host diffs against
// what it last wrote. Shorter arrays are padded with 0/false on the host,
// longer ones are truncated.
message GamepadState {
  uint32 pad_index = 1;
  repeated float axes = 2;
  repeated bool buttons = 3;
}

// Raw HID controllers (gdp-spec.md §8.6), only on a session that
// negotiated both "gamepad" and "hid". A raw controller takes a slot like
// a gamepad does, and GamepadDisconnect ends it.

// spectre -> wraith: the controller in `pad_index`, raw. wraith has ghostd
// create a uhid device with exactly this identity and descriptor, so the
// host's own driver for the controller binds to it.
message HidConnect {
  uint32 pad_index = 1;
  string name = 2;               // the product name, as the platform reports it
  uint32 bus = 3;                // Linux BUS_*: 3 USB, 5 Bluetooth
  uint32 vendor_id = 4;
  uint32 product_id = 5;
  uint32 version = 6;            // bcdDevice / release number
  string uniq = 7;               // serial; a Bluetooth address as aa:bb:cc:dd:ee:ff
  bytes report_descriptor = 8;   // 1..4096 bytes
}

// wraith -> spectre: the slot's raw controller was refused or failed (no
// uhid, ghostd's policy, the driver didn't bind) and the slot is empty.
// spectre may forward the same controller as a gamepad instead.
message HidRejected {
  uint32 pad_index = 1;
  string reason = 2;  // for logs
}

// spectre -> wraith: one input report as the controller delivered it,
// with its report ID first only if the descriptor numbers its reports.
message HidInput {
  uint32 pad_index = 1;
  bytes data = 2;  // at most 4096 bytes
}

// wraith -> spectre: an output report for the controller, report ID first
// (0 when unnumbered).
message HidOutput {
  uint32 pad_index = 1;
  bytes data = 2;
}

enum HidReportType {
  HID_REPORT_TYPE_UNSPECIFIED = 0;
  HID_REPORT_TYPE_INPUT = 1;
  HID_REPORT_TYPE_OUTPUT = 2;
  HID_REPORT_TYPE_FEATURE = 3;
}

// wraith -> spectre: the host's driver reads a report synchronously
// (GET_REPORT). spectre answers with HidGetReportReply, same request_id.
message HidGetReport {
  uint32 pad_index = 1;
  uint32 request_id = 2;
  uint32 report_id = 3;
  HidReportType type = 4;
}

message HidGetReportReply {
  uint32 pad_index = 1;
  uint32 request_id = 2;
  bool failed = 3;
  bytes data = 4;  // report ID first
}

// wraith -> spectre: the host's driver writes a report synchronously
// (SET_REPORT). spectre answers with HidSetReportReply, same request_id.
message HidSetReport {
  uint32 pad_index = 1;
  uint32 request_id = 2;
  uint32 report_id = 3;
  HidReportType type = 4;
  bytes data = 5;  // report ID first (0 when unnumbered)
}

message HidSetReportReply {
  uint32 pad_index = 1;
  uint32 request_id = 2;
  bool failed = 3;
}

// Security keys (gdp-spec.md §8.7), only on a session that negotiated
// "security-key". Two slots of their own, apart from the gamepad slots;
// the host presents every key with the same FIDO descriptor, so none is
// sent, and the two ends relay CTAPHID packets without reading them.

// spectre -> wraith: a key the user chose to forward appeared in the slot.
message SecurityKeyConnect {
  uint32 key_index = 1;  // 0 or 1
  string name = 2;       // the product name, as the platform reports it; at most 128 bytes
  uint32 vendor_id = 3;
  uint32 product_id = 4;
  uint32 version = 5;    // bcdDevice / release number
}

// spectre -> wraith: the slot's key went away or is no longer forwarded.
message SecurityKeyDisconnect {
  uint32 key_index = 1;
}

// wraith -> spectre: the slot's key was refused or failed (no uhid,
// ghostseat's policy) and the slot is empty.
message SecurityKeyRejected {
  uint32 key_index = 1;
  string reason = 2;  // for logs
}

// spectre -> wraith: one CTAPHID packet from the key, exactly 64 bytes,
// no report ID.
message SecurityKeyInput {
  uint32 key_index = 1;
  bytes data = 2;
}

// wraith -> spectre: one CTAPHID packet for the key, exactly 64 bytes,
// no report ID.
message SecurityKeyOutput {
  uint32 key_index = 1;
  bytes data = 2;
}

// Smart cards (gdp-spec.md §8.8), only on a session that negotiated
// "smartcard". The client forwards up to two PC/SC readers, each in a slot
// `reader_index`; the host presents each as a reader of its own and relays
// the card's power and APDUs to the client, which passes, refuses or asks
// its user about each command (gdp/smartcard.hpp's CardPolicy). The host
// keeps each reader's card state from these events, so its PC/SC
// daemon's presence polling never crosses the network.

// spectre -> wraith: a reader appeared in the slot, with or without a card.
// One for an occupied slot replaces its reader.
message SmartcardReaderAdded {
  uint32 reader_index = 1;  // 0 or 1
  string name = 2;          // the reader's PC/SC name; at most 128 bytes
  bool card_present = 3;
  bytes atr = 4;            // the card's ATR, when present; at most 33 bytes
}

// spectre -> wraith: the slot's reader went away or is no longer forwarded.
message SmartcardReaderRemoved {
  uint32 reader_index = 1;
}

// spectre -> wraith: a card went into the slot's reader.
message SmartcardCardInserted {
  uint32 reader_index = 1;
  bytes atr = 2;
}

// spectre -> wraith: the card left the slot's reader. Whatever the host had
// outstanding on it is answered first, with an error.
message SmartcardCardRemoved {
  uint32 reader_index = 1;
}

// wraith -> spectre: the host will not, or could not, present the slot's
// reader, and the slot is empty.
message SmartcardRejected {
  uint32 reader_index = 1;
  string reason = 2;  // for logs
}

enum SmartcardPowerAction {
  SMARTCARD_POWER_ACTION_UNSPECIFIED = 0;
  SMARTCARD_POWER_ACTION_UP = 1;     // power the card up, or reset it if powered
  SMARTCARD_POWER_ACTION_DOWN = 2;
  SMARTCARD_POWER_ACTION_RESET = 3;  // a warm reset: what the card held for the session is gone
}

enum SmartcardError {
  SMARTCARD_ERROR_NONE = 0;
  SMARTCARD_ERROR_NO_CARD = 1;  // no card in the reader, or it was removed
  SMARTCARD_ERROR_BUSY = 2;     // a program at the client holds the card
  SMARTCARD_ERROR_FAILED = 3;   // anything else
}

// wraith -> spectre: power the slot's card up or down, or reset it.
// Answered by one SmartcardPowered with the same sequence.
message SmartcardPower {
  uint32 reader_index = 1;
  uint32 sequence = 2;
  SmartcardPowerAction action = 3;
}

// spectre -> wraith: the answer to SmartcardPower: the card's ATR after a
// power-up or reset, or an error.
message SmartcardPowered {
  uint32 reader_index = 1;
  uint32 sequence = 2;
  SmartcardError error = 3;
  bytes atr = 4;
}

// wraith -> spectre: one command APDU for the slot's powered card. At most
// one is outstanding per reader. Answered by one SmartcardResponse with
// the same sequence.
message SmartcardTransmit {
  uint32 reader_index = 1;
  uint32 sequence = 2;
  bytes apdu = 3;  // 4 to 65544 bytes
}

// spectre -> wraith: the card's response APDU, status word last, or the
// client's in the card's place for a command it refused; or an error.
message SmartcardResponse {
  uint32 reader_index = 1;
  uint32 sequence = 2;
  SmartcardError error = 3;
  bytes response = 4;  // 2 to 65538 bytes
}

message TouchEvent {
  enum Phase {
    PHASE_UNSPECIFIED = 0;
    PHASE_DOWN = 1;
    PHASE_MOVE = 2;
    PHASE_UP = 3;
    PHASE_CANCEL = 4;
  }
  uint32 touch_id = 1;
  Phase phase = 2;
  double x = 3;  // 0..1 normalized
  double y = 4;
}
