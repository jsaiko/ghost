# The stock ExecStart= plus whatever packaging/ghost/sessions/plasma-screencast
# puts in XDG_GHOST_KWIN_ARGS (--virtual) -- startplasma-wayland copies its
# environment into the user manager before it starts kwin, and an unset
# variable expands to no arguments at all, so any other login runs the
# stock command. The XDG_ prefix is what keeps a leftover from reaching a
# later console login: startplasma drops every XDG_* variable its own
# process doesn't have from the user manager before it starts kwin
# (docs/adr/0003-kwin-virtual-through-an-xdg-variable.md).
[Service]
ExecStart=
ExecStart=/usr/bin/kwin_wayland_wrapper --xwayland $XDG_GHOST_KWIN_ARGS
