# The PAM helper's account (docs/design/login-and-sessions.md#authentication):
# a separate account, deliberately not in `ghost`; its privilege (read
# access to /etc/shadow) is a capability on its unit, not a group. The
# `ghost` group is created here because the helper's socket is gated by
# it, on a host (ghostd) and on a Veil (veild) alike.
g ghost -
u ghostauth - "Ghost PAM helper" / /usr/sbin/nologin
