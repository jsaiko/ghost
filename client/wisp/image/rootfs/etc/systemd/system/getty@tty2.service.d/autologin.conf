# A root shell on tty2 (Ctrl+Alt+F2), only when the boot server passes
# wisp.shell (WISP_SHELL=1): otherwise anyone at the keyboard could get
# root and watch the next user type their password.
[Unit]
ConditionKernelCommandLine=wisp.shell

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear %I $TERM
