[package]
name = "ghostauth"
version = "0.6.66"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "ghostauth"
path = "src/main.rs"

[dependencies]
ipc = { path = "../ipc" }
authticket = { path = "../authticket" }
libc = "0.2"
pam-client2 = { version = "0.5", default-features = false }
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
