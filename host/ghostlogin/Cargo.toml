[package]
name = "ghostlogin"
version = "0.6.66"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "ghostlogin"
path = "src/main.rs"

[dependencies]
ipc = { path = "../ipc" }
libc = "0.2"
nix = { version = "0.31", features = ["user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }
anyhow = "1"
