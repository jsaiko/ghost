[workspace]
resolver = "2"
members = ["ipc", "gdpnet", "tomlconf", "pamconv", "preauth", "authticket", "ghostauth", "ghostd", "ghostseat", "ghostlogin", "veil"]

# Every crate's version (version.workspace = true): the project's, from
# the top-level CMakeLists.txt. `make bump V=x.y.z` changes both.
[workspace.package]
version = "0.6.68"

# Release builds are what hosts run (the top-level CMakeLists.txt picks this
# profile for every build type but Debug); keep symbols so backtraces and
# gdb still make sense.
[profile.release]
debug = true
