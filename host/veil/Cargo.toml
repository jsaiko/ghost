[package]
name = "veil"
version = "0.6.66"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "veild"
path = "src/main.rs"

[dependencies]
ipc = { path = "../ipc" }
gdpnet = { path = "../gdpnet" }
pamconv = { path = "../pamconv" }
preauth = { path = "../preauth" }
tomlconf = { path = "../tomlconf" }
quinn = "0.11"
socket2 = "0.6"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "sync"] }
nix = { version = "0.31", features = ["user", "fs", "hostname", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rand = "0.9"
base64 = "0.22"
sha2 = "0.10"
prost = "0.13"
zeroize = "1"
ring = "0.17"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
askama = "0.16"
wtransport = { version = "0.7", default-features = false, features = ["quinn", "ring"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
