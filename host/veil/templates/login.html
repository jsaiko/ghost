<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Veil</title>
<link rel="stylesheet" href="/admin/static/style.css">
</head>
<body class="login">
<main>
  <form method="post" action="/admin/login" class="card">
    <h1>Veil</h1>
    <p class="muted">Administrators sign in with their own account.</p>
    {% if !error.is_empty() %}<p class="error">{{ error }}</p>{% endif %}
    <label>Username <input name="username" autocomplete="username" required autofocus value="{{ username }}"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
