[package]
name = "pamconv"
version = "0.6.66"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
ipc = { path = "../ipc" }
anyhow = "1"
tokio = { version = "1", features = ["net", "io-util", "sync"] }
tracing = "0.1"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
